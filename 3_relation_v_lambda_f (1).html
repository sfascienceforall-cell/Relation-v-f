
<style>*{box-sizing:border-box;margin:0;padding:0;}body{background:#fff;font-family:system-ui,-apple-system,sans-serif;}</style>

<div style="width:100%;height:50vh;min-height:240px;position:relative;border-radius:12px;overflow:hidden;margin-bottom:12px;background:#fff;border:1.5px solid #e8e8e8;">
  <canvas id="cv" style="position:absolute;top:0;left:0;width:100%;height:100%;display:block;"></canvas>
</div>

<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px;">
  <div style="border-radius:12px;padding:10px;text-align:center;background:#e6f1fb;border:1.5px solid #b5d4f4;">
    <div id="cv-v" style="font-size:20px;font-weight:500;color:#185fa5;">—</div>
    <div style="font-size:11px;color:#185fa5;margin-top:2px;">v (m/s)</div>
  </div>
  <div style="border-radius:12px;padding:10px;text-align:center;background:#faeeda;border:1.5px solid #FAC775;">
    <div id="cv-l" style="font-size:20px;font-weight:500;color:#854f0b;">—</div>
    <div style="font-size:11px;color:#854f0b;margin-top:2px;">λ (m)</div>
  </div>
  <div style="border-radius:12px;padding:10px;text-align:center;background:#fbeaf0;border:1.5px solid #F4C0D1;">
    <div id="cv-f" style="font-size:20px;font-weight:500;color:#993556;">—</div>
    <div style="font-size:11px;color:#993556;margin-top:2px;">f (Hz)</div>
  </div>
</div>

<div style="font-size:13px;padding:10px 16px;border-radius:20px;background:#f5f5f5;border:1.5px solid #d0d0d0;color:#2c2c2a;margin:0 0 10px;font-family:ui-monospace,monospace;">
  v = λ · f &nbsp;|&nbsp; λ = v / f &nbsp;|&nbsp; f = v / λ
</div>

<div style="display:flex;align-items:center;gap:12px;margin:6px 0;">
  <span style="min-width:130px;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 16px;white-space:nowrap;">Longueur d'onde λ</span>
  <input type="range" id="sl" min="40" max="300" value="120" step="10" style="flex:1;accent-color:#BA7517;">
  <span id="lv" style="min-width:60px;text-align:center;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 12px;">120 m</span>
</div>
<div style="display:flex;align-items:center;gap:12px;margin:6px 0;">
  <span style="min-width:130px;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 16px;white-space:nowrap;">Fréquence f</span>
  <input type="range" id="sf" min="1" max="20" value="5" step="1" style="flex:1;accent-color:#993556;">
  <span id="fv" style="min-width:60px;text-align:center;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 12px;">5 Hz</span>
</div>

<script>
const cv=document.getElementById('cv');
let animT=0,W=0,H=0;
function getP(){return{lambda:parseFloat(document.getElementById('sl').value),f:parseFloat(document.getElementById('sf').value)};}
function updateCards(){
  const{lambda,f}=getP();const v=lambda*f;
  document.getElementById('cv-v').textContent=v.toFixed(0)+' m/s';
  document.getElementById('cv-l').textContent=lambda.toFixed(0)+' m';
  document.getElementById('cv-f').textContent=f.toFixed(0)+' Hz';
  document.getElementById('lv').textContent=lambda.toFixed(0)+' m';
  document.getElementById('fv').textContent=f.toFixed(0)+' Hz';
}
['sl','sf'].forEach(id=>document.getElementById(id).addEventListener('input',updateCards));
function draw(){
  const rect=cv.parentElement.getBoundingClientRect();
  W=Math.round(rect.width)||700;H=Math.round(rect.height)||260;cv.width=W;cv.height=H;
  const{lambda,f}=getP();const v=lambda*f;
  const cy=H/2;const A=42;
  const k=2*Math.PI/lambda*(W/600);const omega=2*Math.PI*f;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,0,0,0.06)';ctx.lineWidth=0.6;ctx.setLineDash([3,8]);
  ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.stroke();ctx.setLineDash([]);
  ctx.beginPath();ctx.strokeStyle='#378ADD';ctx.lineWidth=2;
  for(let x=0;x<=W;x++){const y=cy-A*Math.sin(k*x-omega*animT*0.016);x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.stroke();
  // lambda bracket
  const lPx=2*Math.PI/k;const p0=(Math.PI/2+omega*animT*0.016)/k%lPx;
  const px0=p0<0?p0+lPx:p0;const px1=px0+lPx;
  if(px1<W&&px0>0){
    const by=cy-A-20;
    ctx.strokeStyle='#BA7517';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(px0,by+5);ctx.lineTo(px0,by);ctx.lineTo(px1,by);ctx.lineTo(px1,by+5);ctx.stroke();
    ctx.fillStyle='#BA7517';ctx.font='13px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('λ',(px0+px1)/2,by-5);
  }
  // v arrow
  ctx.beginPath();ctx.strokeStyle='#378ADD';ctx.lineWidth=1.5;ctx.moveTo(W-100,18);ctx.lineTo(W-44,18);ctx.stroke();
  ctx.beginPath();ctx.fillStyle='#378ADD';ctx.moveTo(W-36,18);ctx.lineTo(W-46,13);ctx.lineTo(W-46,23);ctx.closePath();ctx.fill();
  ctx.fillStyle='#378ADD';ctx.font='12px system-ui,sans-serif';ctx.textAlign='right';ctx.fillText('v = '+v.toFixed(0)+' m/s',W-102,16);
  animT++;requestAnimationFrame(draw);
}
updateCards();draw();
</script>
